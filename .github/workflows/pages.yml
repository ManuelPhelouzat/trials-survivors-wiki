name: GitHub Pages

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r requirements.txt
      - uses: actions/configure-pages@v5
        id: pages
        if: github.event_name == 'push'
      - name: Build and validate both languages
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url || 'https://example.invalid/wiki-preview' }}
        run: python tools/site.py build --site-url "${SITE_URL%/}/"
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
      - run: node tools/search-check.mjs site
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push'
        with:
          path: site

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: github-pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
